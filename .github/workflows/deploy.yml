name: Deploy to Hostinger

on:
  workflow_dispatch:       # Botón manual en GitHub Actions
  push:
    branches:
      - main
      - claude/build-ecom-analytics-saas-Ioldt

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          NEXT_PUBLIC_DEMO_MODE: 'false'

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /domains/dimgrey-narwhal-803722.hostingersite.com/public_html/
          dangerous-clean-slate: true
