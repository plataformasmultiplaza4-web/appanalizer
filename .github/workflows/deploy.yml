name: CI Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/fix-dashboard-app-Fi8t7
      - claude/build-ecom-analytics-saas-Ioldt
      - claude/ai-website-cloner-template-dNncV

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'false'
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
